services:
  db:
    image: postgis/postgis:16-3.4
    container_name: viscalaterra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Lligat a loopback: la BD només és accessible des del propi host, mai des de la LAN.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: viscalaterra_backend
    restart: unless-stopped
    env_file: .env
    command: sh -c "npm install && npm run dev"
    ports:
      # Lligat a loopback: el frontend hi accedeix per la xarxa interna de Docker
      # (proxy de Vite → backend:3000), no cal exposar-lo a la LAN.
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: viscalaterra_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL}
    command: sh -c "npm install && npm run dev"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  db_data:
