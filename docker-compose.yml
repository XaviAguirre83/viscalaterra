# Logs amb tope i rotació automàtica, com a producció (vegeu docker-compose.prod.yml).
x-logs: &logs
  driver: local
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    # La mateixa imatge que a producció (docker-compose.prod.yml, on s'explica el volum).
    image: postgis/postgis:18-3.6
    container_name: viscalaterra_db
    restart: unless-stopped
    logging: *logs
    environment:
      # Administrador i rol de la web, com a producció (vegeu docker-compose.prod.yml).
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:?falta DB_APP_USER al .env (vegeu .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD al .env (vegeu .env.example)}
    ports:
      # Lligat a loopback: la BD només és accessible des del propi host, mai des de la LAN.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db_pg18:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d
      - ./infra/db/migracions:/migracions:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: viscalaterra_backend
    restart: unless-stopped
    logging: *logs
    # Com a producció: només les variables que fa servir i el rol de la web (sense
    # superusuari), perquè en local es provi amb els mateixos permisos.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER:?falta DB_APP_USER al .env (vegeu .env.example)}
      DB_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD al .env (vegeu .env.example)}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET al .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    command: sh -c "npm install && npm run dev"
    ports:
      # Lligat a loopback: el frontend hi accedeix per la xarxa interna de Docker
      # (proxy de Vite → backend:3000), no cal exposar-lo a la LAN.
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - ./backend:/app
    healthcheck:
      # Com a producció: /health comprova també la BD. Marge llarg a l'arrencada
      # perquè abans corre «npm install».
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: viscalaterra_frontend
    restart: unless-stopped
    logging: *logs
    environment:
      - VITE_API_URL=${VITE_API_URL}
    command: sh -c "npm install && npm run dev"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  db_pg18:
