# ================================================================
# Stack de PRODUCCIÓ — viscalaterra.cat
#
# El MATEIX fitxer corre en local (per simular) i al VPS de Hetzner:
#   Local:  docker compose -f docker-compose.prod.yml up --build
#   VPS:    docker compose -f docker-compose.prod.yml up -d --build
#
# Diferències respecte a docker-compose.yml (desenvolupament):
#   - Backend i frontend es COMPILEN (no hi ha hot-reload ni bind-mounts de codi).
#   - Caddy és l'única porta d'entrada (80/443) + HTTPS automàtic + reverse proxy.
#   - Ni la BD ni el backend exposen ports: només són accessibles per la xarxa interna.
# ================================================================

# Projecte propi i aïllat: contenidors, xarxa i volums separats del stack de
# desenvolupament (que usa el projecte per defecte). Així pots tenir tots dos
# alhora sense que xoquin els noms ni es barregin les dades.
name: viscalaterra-prod

# Logs de cada contenidor amb tope i rotació automàtica (driver «local» de Docker):
# com a màxim 5 fitxers de 10 MB, comprimits; quan s'omple l'últim, s'esborra el més
# antic. Sense això, el driver per defecte (json-file) creix sense límit fins a omplir
# el disc. Només s'aplica als contenidors que es creen de nou (no als ja existents).
x-logs: &logs
  driver: local
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    # PostgreSQL 18 + PostGIS 3.6. Quan surti una PostGIS nova, l'etiqueta -3.6
    # deixarà de regenerar-se (com va passar amb la 16-3.4): cal vigilar-ho.
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    logging: *logs
    environment:
      # Administrador (superusuari): crea la BD i les taules en néixer el volum i
      # serveix per al manteniment (migracions, còpies). La web no l'usa mai.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Rol de la web, sense superusuari: el crea infra/db/init/06-rol-aplicacio.sh.
      DB_APP_USER: ${DB_APP_USER:?falta DB_APP_USER al .env (vegeu .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD al .env (vegeu .env.example)}
    volumes:
      # Des de la 18 la imatge desa les dades a /var/lib/postgresql/18/docker: el
      # volum es munta a /var/lib/postgresql (amb la ruta antiga .../data, la imatge
      # es nega a arrencar). La versió major va al nom del volum: per migrar a una
      # major nova se'n crea un altre al costat i aquest queda per tornar enrere.
      - db_pg18:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sense 'ports': la BD només és accessible per la xarxa interna de Docker.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logs
    # Només les variables que fa servir, no tot el .env: la contrasenya
    # d'administrador de la BD i el hash de la porta de staging no hi arriben.
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      # Es connecta amb el rol de la web (sense superusuari), no amb l'administrador.
      DB_USER: ${DB_APP_USER:?falta DB_APP_USER al .env (vegeu .env.example)}
      DB_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD al .env (vegeu .env.example)}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET al .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS al .env (l'origen públic de la web)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Mai buits: el backend els passa per Number() i un buit seria 0.
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    volumes:
      # Geodades de l'ICC (no són al git): muntades en NOMÉS-LECTURA des del host.
      - ./backend/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    # Sense 'ports': només hi accedeix Caddy per la xarxa interna.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Botó de Google: el mateix Client ID (públic) que verifica el backend.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    logging: *logs
    environment:
      # En local, sense definir SITE_ADDRESS → ':80' (HTTP).
      # Al VPS, posa SITE_ADDRESS=viscalaterra.cat al .env → HTTPS automàtic.
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      # Entorn del Caddyfile: «produccio» (per defecte) o «staging» (porta amb
      # contrasenya compartida + noindex). El hash, només a staging.
      - CADDY_ENTORN=${CADDY_ENTORN:-produccio}
      - STAGING_HASH=${STAGING_HASH:-}
    ports:
      # Per defecte 80/443 (correcte al VPS). En local amb Docker rootless, els
      # ports < 1024 no es poden usar: posa HTTP_PORT=8080 i HTTPS_PORT=8443 al .env.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Persisteixen els certificats TLS entre reinicis (no tornar a demanar-los a Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_pg18:
  caddy_data:
  caddy_config:
