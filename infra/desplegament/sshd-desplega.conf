# /etc/ssh/sshd_config.d/20-desplega.conf
# Usuari del botó de desplegament (GitHub Actions). Vegeu infra/desplegament/README.md.

# S'afegeix a la llista d'usuaris que poden entrar (AllowUsers no se substitueix:
# cada línia hi suma noms, així que ubuntu continua a la llista de 10-*.conf).
AllowUsers desplega

Match User desplega
    # Només amb clau, i la clau és en un fitxer de root que desplega no pot tocar.
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/ssh/desplega/authorized_keys
    # Demani el que demani, només s'executa això (i no hi ha terminal).
    ForceCommand /usr/local/sbin/desplega-ssh
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    DisableForwarding yes
