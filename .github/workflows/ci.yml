# This is a GitHub Actions workflow file that defines a continuous integration (CI) pipeline for a project.
name: CI

# The workflow is triggered on pushes and pull requests to the main and develop branches.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Permisos mínims del token del CI: només llegir el codi (cap job no escriu res al
# repositori). Les accions van fixades per SHA (la seva empremta exacta) i no per
# etiqueta, que es podria moure cap a un altre codi; el comentari diu la versió.
permissions:
  contents: read

# It consists of three jobs:
jobs:
  quality:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # No deixar el token del CI desat a .git/config durant la resta del job.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Sempre l'última 24.x publicada (pegats de seguretat), no la que el
          # runner de GitHub porta preinstal·lada.
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Vulnerabilitats conegudes (high o superior) a les dependències de PRODUCCIÓ
      # (les que acaben al servidor o a la web publicada) trenquen el CI.
      - run: npm audit --omit=dev --audit-level=high
      # Les de desenvolupament només s'informen, sense bloquejar: n'hi pot haver sense
      # versió corregida (p. ex. braces <=3.0.3, GHSA-vfj7-8cjw-p6xm, via
      # @vue/eslint-config-typescript) i no arriben mai al servidor.
      - run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend — lint, types & tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # No deixar el token del CI desat a .git/config durant la resta del job.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run type-check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend — types & build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # No deixar el token del CI desat a .git/config durant la resta del job.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
        working-directory: backend
