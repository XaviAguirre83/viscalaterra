# This is a GitHub Actions workflow file that defines a continuous integration (CI) pipeline for a project.
name: CI

# The workflow is triggered on pushes and pull requests to the main and develop branches.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# It consists of three jobs:
jobs:
  quality:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Dependències amb vulnerabilitats conegudes (high o superior) trenquen el CI.
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend — lint, types & tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend — types & build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        working-directory: backend
